<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Marsh Consultoria</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0066cc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Marsh" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    .login-card {
      position: relative;
      background: var(--bg-elevated);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg, 16px);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px var(--border),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: loginFadeIn 0.5s ease-out;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(96,165,250,0.35), transparent 40%, rgba(34,211,238,0.25));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes loginFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .login-logo span {
      background: linear-gradient(90deg, var(--accent-cyan), var(--primary-hover));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .login-logo p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.35rem;
    }

    .form-group { margin-bottom: 1.25rem; }

    .form-group label {
      display: block;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-bottom: 0.45rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(2, 8, 23, 0.55);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      transition: var(--transition);
      outline: none;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .form-group input::placeholder { color: var(--text-subtle); }

    .form-group input:focus {
      border-color: var(--primary-hover);
      background: rgba(2, 8, 23, 0.78);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18), 0 0 24px rgba(37, 99, 235, 0.14);
    }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: 1px solid rgba(96, 165, 250, 0.4);
      border-radius: 10px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255,255,255,0.22);
      filter: brightness(1.05);
    }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .mensagem {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }

    .mensagem.erro {
      background: rgba(239,68,68,0.12);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,0.3);
      display: block;
    }

    .mensagem.sucesso {
      background: rgba(16,185,129,0.12);
      color: #6ee7b7;
      border: 1px solid rgba(16,185,129,0.3);
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: var(--text-subtle);
    }

    /* ===== DECORAÇÕES FUTURISTAS ===== */
    .login-bg-fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    /* Grid de pontos animado */
    .login-grid {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(96, 165, 250, 0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      animation: gridDrift 24s linear infinite;
      opacity: 0.55;
    }
    @keyframes gridDrift {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(-40px, -40px); }
    }
    /* Orbes de glow flutuantes */
    .login-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      animation: orbFloat 14s ease-in-out infinite alternate;
    }
    .login-orb.orb-1 {
      width: 320px; height: 320px;
      left: -80px; top: -60px;
      background: radial-gradient(circle, var(--primary), transparent 60%);
    }
    .login-orb.orb-2 {
      width: 280px; height: 280px;
      right: -60px; bottom: -80px;
      background: radial-gradient(circle, var(--accent-cyan), transparent 60%);
      animation-delay: -7s;
    }
    @keyframes orbFloat {
      0%   { transform: translate(0, 0)     scale(1); }
      50%  { transform: translate(40px, -30px) scale(1.08); }
      100% { transform: translate(-30px, 25px)  scale(0.95); }
    }
    /* Linhas verticais sutis (estilo terminal) */
    .login-scan {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(96, 165, 250, 0.03) 50%,
        transparent 100%);
      animation: scanLine 8s linear infinite;
      opacity: 0.5;
    }
    @keyframes scanLine {
      0%   { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    /* Bordas decorativas nos cantos do card */
    .login-card::after {
      content: "";
      position: absolute;
      top: -6px; left: -6px;
      width: 32px; height: 32px;
      border-top: 2px solid var(--accent-cyan);
      border-left: 2px solid var(--accent-cyan);
      border-top-left-radius: 14px;
      opacity: 0.6;
      filter: drop-shadow(0 0 8px var(--accent-cyan));
    }
    .login-card-corner {
      position: absolute;
      bottom: -6px; right: -6px;
      width: 32px; height: 32px;
      border-bottom: 2px solid var(--primary);
      border-right: 2px solid var(--primary);
      border-bottom-right-radius: 14px;
      opacity: 0.6;
      filter: drop-shadow(0 0 8px var(--primary));
    }

    /* Logo: efeito pulse no ponto antes de "Marsh" */
    .login-logo h1::before {
      content: "•";
      color: var(--accent-cyan);
      margin-right: 6px;
      animation: dotPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 6px var(--accent-cyan));
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.85); }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-grid, .login-orb, .login-scan, .login-logo h1::before {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Decorações de fundo (grid + orbes + scan) -->
  <div class="login-bg-fx" aria-hidden="true">
    <div class="login-grid"></div>
    <div class="login-orb orb-1"></div>
    <div class="login-orb orb-2"></div>
    <div class="login-scan"></div>
  </div>

  <div class="login-card">
    <div class="login-card-corner" aria-hidden="true"></div>
    <div class="login-logo">
      <a href="/index.html" style="text-decoration:none;color:inherit"><h1>Marsh <span>Consultoria</span></h1></a>
      <p>Sistema de Gestão</p>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-login" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
    <div class="mensagem" id="login-msg"></div>

    <div class="login-footer">Acesso restrito — contate o administrador para obter credenciais</div>
  </div>

  <script>
    // Redireciona se já autenticado
    const tokenExistente = localStorage.getItem('token');
    const usuarioExistente = JSON.parse(localStorage.getItem('usuario') || 'null');
    if (tokenExistente && usuarioExistente) {
      if (usuarioExistente.tipo === 'cliente') {
        window.location.href = '/portal.html';
      } else {
        window.location.href = '/dashboard.html';
      }
    }

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('login-msg');
      el.textContent = texto;
      el.className = `mensagem ${tipo}`;
    }

    async function fazerLogin() {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      const btn = document.getElementById('btn-entrar');

      if (!email || !senha) {
        return mostrarMensagem('Preencha email e senha.', 'erro');
      }

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();

        if (!res.ok) {
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return mostrarMensagem(data.erro, 'erro');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));

        // Redireciona baseado no tipo de usuário
        if (data.usuario.tipo === 'cliente') {
          window.location.href = '/portal.html';
        } else {
          window.location.href = '/dashboard.html';
        }
      } catch {
        btn.disabled = false;
        btn.textContent = 'Entrar';
        mostrarMensagem('Erro de conexão. Tente novamente.', 'erro');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') fazerLogin();
    });

    // Anti-FOUC: ao digitar email, busca o tema do usuário e aplica antes do login
    const _emailInput = document.getElementById('login-email');
    let _temaLookupTimer = null;
    if (_emailInput && window.Theme) {
      _emailInput.addEventListener('blur', () => {
        clearTimeout(_temaLookupTimer);
        const email = _emailInput.value.trim();
        if (email && email.includes('@')) {
          _temaLookupTimer = setTimeout(() => window.Theme.lookupByEmail(email), 200);
        }
      });
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
