<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Marsh Consultoria</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0066cc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Marsh" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    .login-card {
      position: relative;
      background: var(--bg-elevated);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg, 16px);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px var(--border),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: loginFadeIn 0.5s ease-out;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(96,165,250,0.35), transparent 40%, rgba(34,211,238,0.25));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes loginFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .login-logo span {
      background: linear-gradient(90deg, var(--accent-cyan), var(--primary-hover));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .login-logo p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.35rem;
    }

    .form-group { margin-bottom: 1.25rem; }

    .form-group label {
      display: block;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-bottom: 0.45rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(2, 8, 23, 0.55);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      transition: var(--transition);
      outline: none;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .form-group input::placeholder { color: var(--text-subtle); }

    .form-group input:focus {
      border-color: var(--primary-hover);
      background: rgba(2, 8, 23, 0.78);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18), 0 0 24px rgba(37, 99, 235, 0.14);
    }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: 1px solid rgba(96, 165, 250, 0.4);
      border-radius: 10px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255,255,255,0.22);
      filter: brightness(1.05);
    }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .mensagem {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }

    .mensagem.erro {
      background: rgba(239,68,68,0.12);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,0.3);
      display: block;
    }

    .mensagem.sucesso {
      background: rgba(16,185,129,0.12);
      color: #6ee7b7;
      border: 1px solid rgba(16,185,129,0.3);
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: var(--text-subtle);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <a href="/index.html" style="text-decoration:none;color:inherit"><h1>Marsh <span>Consultoria</span></h1></a>
      <p>Sistema de Gestão</p>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-login" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
    <div class="mensagem" id="login-msg"></div>

    <div class="login-footer">Acesso restrito — contate o administrador para obter credenciais</div>
  </div>

  <script>
    // Redireciona se já autenticado
    const tokenExistente = localStorage.getItem('token');
    const usuarioExistente = JSON.parse(localStorage.getItem('usuario') || 'null');
    if (tokenExistente && usuarioExistente) {
      if (usuarioExistente.tipo === 'cliente') {
        window.location.href = '/portal.html';
      } else {
        window.location.href = '/dashboard.html';
      }
    }

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('login-msg');
      el.textContent = texto;
      el.className = `mensagem ${tipo}`;
    }

    async function fazerLogin() {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      const btn = document.getElementById('btn-entrar');

      if (!email || !senha) {
        return mostrarMensagem('Preencha email e senha.', 'erro');
      }

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();

        if (!res.ok) {
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return mostrarMensagem(data.erro, 'erro');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));

        // Redireciona baseado no tipo de usuário
        if (data.usuario.tipo === 'cliente') {
          window.location.href = '/portal.html';
        } else {
          window.location.href = '/dashboard.html';
        }
      } catch {
        btn.disabled = false;
        btn.textContent = 'Entrar';
        mostrarMensagem('Erro de conexão. Tente novamente.', 'erro');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') fazerLogin();
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
